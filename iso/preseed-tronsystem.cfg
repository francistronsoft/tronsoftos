d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string tronsystem
d-i netcfg/get_domain string local

d-i passwd/root-login boolean true
d-i passwd/root-password password 310#!)
d-i passwd/root-password-again password 310#!)
d-i passwd/user-fullname string TronSoft
d-i passwd/username string tronsoft
d-i passwd/user-password password su61613225Ts
d-i passwd/user-password-again password su61613225Ts
d-i user-setup/allow-password-weak boolean true

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo git curl ca-certificates openssh-server rsync ethtool
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

d-i preseed/late_command string \
  cp /cdrom/tronsystem-late-command.sh /target/usr/local/sbin/tronsystem-late-command.sh; \
  cp /cdrom/tronsystem-source.tar.gz /target/usr/local/share/tronsystem-source.tar.gz; \
  if [ -f /cdrom/tronsystem-docker-images.tar ]; then cp /cdrom/tronsystem-docker-images.tar /target/usr/local/share/tronsystem-docker-images.tar; fi; \
  chmod 0755 /target/usr/local/sbin/tronsystem-late-command.sh; \
  in-target /bin/bash /usr/local/sbin/tronsystem-late-command.sh

d-i finish-install/reboot_in_progress note
