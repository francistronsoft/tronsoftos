server {
  listen 80;
  server_name _;

  location = / {
    add_header Content-Type text/html;
    return 200 '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TronComanda</title></head><body><h1>It works!</h1></body></html>';
  }

  location = /qr {
    return 301 /qr/;
  }

  location /qr/ {
    proxy_pass http://qr/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /cardapio {
    return 301 /cardapio/;
  }

  location /cardapio/ {
    proxy_pass http://cardapio-lite/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /tsretaguarda-api {
    return 301 /tsretaguarda-api/;
  }

  location /tsretaguarda-api/ {
    proxy_pass http://tsretaguarda-api:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /retaguarda {
    return 301 /retaguarda/;
  }

  location /retaguarda/ {
    proxy_pass http://tsretaguarda-web:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    add_header Content-Type application/json;
    return 200 '{"ok":true,"app":"TronComanda"}';
  }
}
