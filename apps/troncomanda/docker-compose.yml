name: troncomanda

services:
  web:
    image: nginx:1.27-alpine
    container_name: troncomanda_web
    restart: unless-stopped
    ports:
      - "0.0.0.0:${TRONCOMANDA_WEB_PORT:-8000}:80"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    image: ghcr.io/tronsoft-solucoes/ts-restaurant${API_IMAGE_TAG:-:main}
    container_name: troncomanda_api
    restart: unless-stopped
    ports:
      - "0.0.0.0:${TRONCOMANDA_API_PORT:-9000}:9000"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      SECRET_KEY: ${TRONCOMANDA_SECRET_KEY}
      DATABASE_URL: firebird://${TRONCOMANDA_FIREBIRD_USER:-sysdba}:${TRONCOMANDA_FIREBIRD_PASSWORD:-masterkey}@${TRONCOMANDA_FIREBIRD_HOST:-host.docker.internal}/${TRONCOMANDA_DATABASE_ALIAS:-ERP_TRONSOFT}?charset=${TRONCOMANDA_DATABASE_CHARSET:-win1252}
      STATIC_ASSETS_PATH: /usr/app/public
      STATIC_ASSETS_URL: /qr/public
      TRONCOMANDA_LAN_HOST: ${TRONCOMANDA_LAN_HOST:-}
      PUBLIC_URL: ${TRONCOMANDA_PUBLIC_URL:-}
    volumes:
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/qr-static:/usr/app/public
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qr:
    image: ghcr.io/tronsoft-solucoes/tron-comanda${QR_IMAGE_TAG:-:main}
    container_name: troncomanda_qr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/qr-static:/usr/share/nginx/html/public

  cardapio-lite:
    image: ghcr.io/tronsoft-solucoes/tscardapio-lite${CARDAPIO_IMAGE_TAG:-:main}
    container_name: troncomanda_cardapio_lite
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/qr-static:/usr/share/nginx/html/public/img

  tsretaguarda-api:
    image: ghcr.io/tronsoft-solucoes/tsretaguarda-web-lite-api${RETAGUARDA_API_IMAGE_TAG:-:main}
    container_name: tsretaguarda-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:${TSRETAGUARDA_API_PORT:-9001}:9000"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: firebird://${TRONCOMANDA_FIREBIRD_USER:-sysdba}:${TRONCOMANDA_FIREBIRD_PASSWORD:-masterkey}@${TRONCOMANDA_FIREBIRD_HOST:-host.docker.internal}/${TRONCOMANDA_DATABASE_ALIAS:-ERP_TRONSOFT}?charset=${TRONCOMANDA_DATABASE_CHARSET:-win1252}
      STATIC_ASSETS_PATH: /app/TRONSOFT/imagens
      STATIC_ASSETS_URL: /tsretaguarda-api/public
    volumes:
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/arquivos-nfe:/app/Arquivos_NFE
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/sped-fiscal-sintegra:/app/SpedFiscal_e_Sintegra
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/empresas:/app/empresas
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/qr-static:/app/TRONSOFT/imagens
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tsretaguarda-web:
    image: ghcr.io/tronsoft-solucoes/retaguarda-web-nextjs${RETAGUARDA_WEB_IMAGE_TAG:-:main}
    container_name: tsretaguarda-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:${TSRETAGUARDA_WEB_PORT:-8010}:8010"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      NEXT_PUBLIC_API_BASE_URL: http://tsretaguarda-api:9000
      API_BASE_URL: http://tsretaguarda-api:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_MENU_ITEM_IMAGE_ORIGIN: http://tsretaguarda-api:9000
    volumes:
      - ${TRONCOMANDA_STORAGE_ROOT:-/opt/tronfire-storage/troncomanda}/qr-static:/app/public/public
    depends_on:
      - tsretaguarda-api

networks:
  default:
    name: troncomanda_net
